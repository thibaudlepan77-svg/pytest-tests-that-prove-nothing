name: verify every example

# Every output in this repository is a real pytest run. This workflow re-runs
# all 85 of them on every push and compares, after rewriting only the lines
# that depend on the machine. The list of what gets rewritten is at the top of
# verifier.py.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest==9.1.1
      - run: python verifier.py -v
